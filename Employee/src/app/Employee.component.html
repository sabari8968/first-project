<div class="container py-5">
  <!-- Employee Form -->
  <div
    class="d-flex justify-content-center align-items-center"
    style="height: 100vh"
  >
    <div class="shadow p-5 rounded" style="width: 400px">
      <form #registerForm="ngForm" (ngSubmit)="addEmployee(registerForm)">
        <h4 class="display-6 text-center py-2">Employee Details</h4>

        <!-- Name -->
        <div class="mb-3">
          <label for="name" class="form-label">Name</label>
          <input
            id="name"
            name="name"
            ngModel
            #name="ngModel"
            required
            type="text"
            class="form-control"
            placeholder="Enter name"
          />
          <div *ngIf="name.invalid && name.touched">
            <small class="text-danger">Required</small>
          </div>
        </div>

        <!-- Position -->
        <div class="mb-3">
          <label for="position" class="form-label">Position</label>
          <input
            id="position"
            name="position"
            ngModel
            #position="ngModel"
            required
            type="text"
            class="form-control"
            placeholder="Enter position"
          />
          <div *ngIf="position.invalid && position.touched">
            <small class="text-danger">Required</small>
          </div>
        </div>

        <!-- Salary -->
        <div class="mb-3">
          <label for="salary" class="form-label">Salary</label>
          <input
            id="salary"
            name="salary"
            ngModel
            #salary="ngModel"
            required
            type="number"
            step="0.01"
            class="form-control"
            placeholder="Enter salary"
          />
          <div *ngIf="salary.invalid && salary.touched">
            <small class="text-danger">Required</small>
          </div>
        </div>

        <!-- Submit Button -->
        <div class="text-center">
          <button
            class="btn btn-primary"
            type="submit"
            [disabled]="registerForm.invalid"
          >
            Submit
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Employee Table -->
  <div class="mt-5">
    <table class="table table-bordered text-center">
      <thead class="table-light">
        <tr>
          <th>Employee ID</th>
          <th>Name</th>
          <th>Position</th>
          <th>Salary</th>
          <th>Edit</th>
          <th>Delete</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let employee of employees">
          <td>{{ employee.employeeId }}</td>
          <td>{{ employee.name }}</td>
          <td>{{ employee.position }}</td>
          <td>{{ employee.salary }}</td>
          <td>
            <button
              type="button"
              class="btn btn-sm btn-primary"
              data-bs-toggle="modal"
              data-bs-target="#exampleModal"
              (click)="edit(employee)"
            >
              Edit
            </button>
          </td>
          <td>
            <button
              type="button"
              class="btn btn-sm btn-danger"
              (click)="deleteEmployee(employee)"
            >
              Delete
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Update Modal -->
  <div
    class="modal fade"
    id="exampleModal"
    tabindex="-1"
    aria-labelledby="exampleModalLabel"
    aria-hidden="true"
  >
    <div class="modal-dialog">
      <div class="modal-content">
        <form #updateForm="ngForm" (ngSubmit)="updateEmployee()">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="exampleModalLabel">
              Update Employee
            </h1>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>

          <div class="modal-body">
            <div class="mb-3">
              <label for="editName" class="form-label">Name</label>
              <input
                id="editName"
                name="editName"
                [(ngModel)]="employeeToUpdate.name"
                required
                type="text"
                class="form-control"
                placeholder="Enter name"
              />
            </div>

            <div class="mb-3">
              <label for="editPosition" class="form-label">Position</label>
              <input
                id="editPosition"
                name="editPosition"
                [(ngModel)]="employeeToUpdate.position"
                required
                type="text"
                class="form-control"
                placeholder="Enter position"
              />
            </div>

            <div class="mb-3">
              <label for="editSalary" class="form-label">Salary</label>
              <input
                id="editSalary"
                name="editSalary"
                [(ngModel)]="employeeToUpdate.salary"
                required
                type="number"
                step="0.01"
                class="form-control"
                placeholder="Enter salary"
              />
            </div>
          </div>

          <div class="modal-footer">
            <button
              type="submit"
              class="btn btn-primary"
              data-bs-dismiss="modal"
            >
              Update
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
